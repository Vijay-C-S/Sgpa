<script src="shared.js"></script>
<script>
    // 7th Semester subjects with credits
    // Added 'isProject' flag to handle the 200 marks normalization
    const subjects = [
        { id: 'sub1', credits: 4, isProject: false },
        { id: 'sub2', credits: 4, isProject: false },
        { id: 'sub3', credits: 4, isProject: false },
        { id: 'sub4', credits: 3, isProject: false },
        { id: 'sub5', credits: 3, isProject: false },
        { id: 'lab1', credits: 6, isProject: true } 
    ];
    const totalCredits = 24;

    function calculate() {
        let totalPoints = 0;

        for (const sub of subjects) {
            let marks = parseFloat(document.getElementById(sub.id).value) || 0;
            
            // Normalize marks to 100-scale if it's the project
            let normalizedMarks = sub.isProject ? marks / 2 : marks;
            
            // Standard VTU Grade Point logic
            let gradePoint = 0;
            if (normalizedMarks >= 90) gradePoint = 10;
            else if (normalizedMarks >= 80) gradePoint = 9;
            else if (normalizedMarks >= 70) gradePoint = 8;
            else if (normalizedMarks >= 60) gradePoint = 7;
            else if (normalizedMarks >= 55) gradePoint = 6;
            else if (normalizedMarks >= 50) gradePoint = 5;
            else if (normalizedMarks >= 40) gradePoint = 4;
            else gradePoint = 0;

            totalPoints += gradePoint * sub.credits;
        }

        const sgpa = (totalPoints / totalCredits).toFixed(2);
        displayResult(sgpa);
    }
</script>
